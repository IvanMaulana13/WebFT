version: "3.9"

# Kompatibel dengan:
#   docker compose up -d
#   podman-compose up -d
#
# Atau jalankan langsung tanpa compose:
#   podman run -d --name ft_uwks_mysql \
#     -e MYSQL_ROOT_PASSWORD=password \
#     -e MYSQL_DATABASE=ft_uwks_cms \
#     -p 3306:3306 \
#     mysql:8.0 --default-authentication-plugin=mysql_native_password

services:
  mysql:
    image: mysql:8.0
    container_name: ft_uwks_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ft_uwks_cms
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
    driver: local
