services:
  mysql:
    image: mysql:8.0
    container_name: ft_uwks_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ft_uwks_cms
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./drizzle/setup_full.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ft-uwks-cms:latest
    container_name: ft_uwks_web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://root:password@mysql:3306/ft_uwks_cms
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=2057f5a082839c05c12c2fe14aa487ff553144dc7c49d41fd107336f6c182bec
      - NEXTAUTH_SECRET=2057f5a082839c05c12c2fe14aa487ff553144dc7c49d41fd107336f6c182bec
    ports:
      - "3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  mysql_data:
    driver: local
